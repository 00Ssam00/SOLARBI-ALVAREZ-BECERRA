# PostgreSQL con almacenamiento persistente (StatefulSet + PVC).
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: solarbi}
spec:
  clusterIP: None            # servicio headless: DNS postgres.solarbi.svc.cluster.local
  selector: {app: postgres}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres-externo, namespace: solarbi}
spec:
  type: LoadBalancer         # OrbStack lo publica en localhost:5432 (para Power BI y psql)
  selector: {app: postgres}
  ports: [{name: pg, port: 5433, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: solarbi}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: solarbi}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - name: POSTGRES_USER
          valueFrom: {secretKeyRef: {name: solarbi-credenciales, key: PG_USUARIO}}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: solarbi-credenciales, key: PG_CLAVE}}
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d solarbi"]}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d solarbi"]}
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        volumeMounts: [{name: datos, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: datos}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 5Gi}}
