# SolarBI: PostgreSQL y Grafana locales. Las credenciales salen del archivo .env (no se sube al repo).
services:
  postgres:
    image: postgres:17
    container_name: solarbi-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=America/Bogota"]
    environment:
      POSTGRES_USER: ${PGUSER:?define PGUSER en .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?define PGPASSWORD en .env}
      POSTGRES_DB: ${PGDATABASE:?define PGDATABASE en .env}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"   # solo accesible desde este equipo
    volumes:
      - solarbi_pgdata:/var/lib/postgresql/data   # volumen de Docker, fuera del repo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: solarbi-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD en .env}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Bogota
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # variables que el aprovisionamiento de la fuente de datos interpola (no hay credenciales en el repo)
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - solarbi_grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/etc/grafana/dashboards/dashboard.json:ro

volumes:
  solarbi_pgdata:
  solarbi_grafana:
