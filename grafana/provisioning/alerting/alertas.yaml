apiVersion: 1
groups:
  - orgId: 1
    name: operacion-microrred
    folder: SolarBI
    interval: 30s
    rules:
      - uid: solarbi-bateria-baja
        title: Batería baja
        condition: B
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels: {severidad: alta}
        annotations:
          summary: "El SOC del inversor {{ $labels.inversor }} está por debajo de 30 %"
          description: "Regla 1: última lectura de SOC (ventana de 5 minutos) menor a 30 %."
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: solarbi-pg
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: "SELECT DISTINCT ON (inversor_id) inversor_id::text AS inversor, soc::float8 AS value FROM rt.lectura WHERE ts > now() - interval '5 minutes' ORDER BY inversor_id, ts DESC"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{evaluator: {type: lt, params: [30]}}]
      - uid: solarbi-alarma-inversor
        title: Alarma activa en un inversor
        condition: B
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels: {severidad: media}
        annotations:
          summary: "El inversor {{ $labels.inversor }} reporta alarma"
          description: "Regla 2: hay lecturas con alarma activa en los últimos 2 minutos."
        data:
          - refId: A
            relativeTimeRange: {from: 120, to: 0}
            datasourceUid: solarbi-pg
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: "SELECT inversor_id::text AS inversor, (COUNT(*) FILTER (WHERE alarma))::float8 AS value FROM rt.lectura WHERE ts > now() - interval '2 minutes' GROUP BY 1"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions: [{evaluator: {type: gt, params: [0]}}]
